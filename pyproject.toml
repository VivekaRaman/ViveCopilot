[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivecopilot"
version = "0.1.0"
description = "An approval-based, repository-aware coding assistant demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.30,<3"]

[project.scripts]
vivecopilot = "vivecopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
